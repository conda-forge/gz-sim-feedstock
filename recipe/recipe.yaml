schema_version: 1

context:
  component_name: sim
  repo_name: ${{ "gz-" ~ component_name }}
  version: "10.7.0"
  major_version: "10"
  name: ${{ repo_name }}
  component_version: ${{ component_name ~ major_version }}
  cxx_name: ${{ "lib" ~ name }}
  python_name: ${{ name ~ "-python" }}

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/gazebosim/${{ repo_name }}/archive/refs/tags/${{ repo_name }}${{ major_version }}_${{ version }}.tar.gz
    sha256: be602fea790ca952fadacaee383d5a4a7b98a50258affd71ea3d22e97b77978c
    patches:
      - standalone_bindings.patch
      - support_protobuf_crosscompilation.patch

build:
  number: 4

outputs:
  - package:
      name: ${{ cxx_name }}
    build:
      script:
        - if: unix
          then: build_cxx.sh
        - if: win
          then: bld_cxx.bat
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - pkgconf
        - ninja
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - pybind11
            - pybind11-abi
            - libabseil
            - libprotobuf
            - libgz-msgs
            - qt6-main
        - if: unix
          then:
            - make
      host:
        - libgz-cmake
        - libsdformat
        - libgz-plugin
        - libgz-transport
        - libgz-msgs
        - libgz-common
        - libgz-fuel-tools
        - libgz-gui
        - libgz-physics
        - libgz-sensors
        - libgz-rendering
        - libgz-utils
        - libgz-math
        - libgz-tools
        - libabseil
        - libprotobuf
        - qt6-main
        - tinyxml2
        - if: linux
          then:
            - libgl-devel
            - xorg-libxfixes
        - python
        - pybind11
        - pybind11-abi
        # Not a dependency of python any more since Python 3.15, but needed
        # to embed Python in the python-system-loader-system plugin
        - if: unix
          then:
            - libpython
        - if: win
          then:
            - dlfcn-win32
      run:
        - if: unix
          then:
            - libpython
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
    tests:
      - package_contents:
          include:
            - gz/${{ component_version }}/gz/${{ component_name }}.hh
          lib:
            - gz-${{ component_name }}
            - ${{ name }}-python-system-loader-system
      # etc/conda/env_vars.d/<pkg>.json is activated, with the installation prefix
      - script:
          - if: unix
            then: test "${GZ_SIM_SYSTEM_PLUGIN_PATH}" = "${CONDA_PREFIX}/lib"
          - if: win
            then: 'if not "%GZ_SIM_SYSTEM_PLUGIN_PATH:\=/%"=="%CONDA_PREFIX:\=/%/Library/bin" exit 1'
      - script:
          - cmake-package-check gz-${{ component_name }} --targets gz-${{ component_name }}::gz-${{ component_name }}
        requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}

  - package:
      name: ${{ python_name }}
    build:
      script:
        - if: unix
          then: build_py.sh
        - if: win
          then: bld_py.bat
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - swig
        - ninja
        - cmake
        - pkgconf
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - pybind11
            - pybind11-abi
            - pytest
      host:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
        - libgz-common
        - libgz-msgs
        - python
        - pybind11
        - pybind11-abi
        - pytest
        - if: linux
          then:
            - xorg-libxfixes
            - libgl-devel
        - libabseil
        - libprotobuf
      run:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
        - python
    tests:
      - python:
          imports:
            - gz.${{ component_name }}

  - package:
      name: ${{ name }}
    requirements:
      host:
        # This is not a real dependency, but we ensure that we build a different variant of gz-sim for each
        # python version, and that make sense as there is different variant of gz-sim for each python version.
        - python
      run:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
        - ${{ pin_subpackage(python_name, upper_bound='x.x.x') }}
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
    tests:
      - python:
          imports:
            - gz.${{ component_name }}
      - script:
          - cmake-package-check gz-${{ component_name }} --targets gz-${{ component_name }}::gz-${{ component_name }}
        requirements:
          run:
            - cmake-package-check
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}

about:
  homepage: https://github.com/gazebosim/gz-sim
  license: Apache-2.0
  license_file: LICENSE
  summary: Open source robotics simulator. The latest version of Gazebo.

extra:
  feedstock-name: ${{ repo_name }}
  recipe-maintainers:
    - wolfv
    - traversaro
    - Tobias-Fischer
